defaults:
  - _self_
  - augmentations: symmetric.yaml
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "simclr-cifar10" # change here for cifar100
method: "simclr"
backbone:
  name: "resnet18"
method_kwargs:
  proj_hidden_dim: 2048
  proj_output_dim: 256
  temperature: 0.2
data:
  dataset: cifar10 # change here for cifar100
  train_path: "./datasets"
  val_path: "datasets/imagenet100/val"
  format: "image_folder"
  num_workers: 4
optimizer:
  name: "lars"
  batch_size: 256
  lr: 0.4
  classifier_lr: 0.1
  weight_decay: 1e-4
  kwargs:
    clip_lr: True
    eta: 0.02
    exclude_bias_n_norm: True
scheduler:
  name: "warmup_cosine"
checkpoint:
  enabled: True
  dir: "trained_models"
  frequency: 1
auto_resume:
  enabled: True

# overwrite PL stuff
max_epochs: 1000
devices: [1]
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 16-mixed

batch_augmentations:
  style_transfer:
    enabled: false
    # Path to pre-extracted style features (numpy array)
    features_path: "$HOME/my_work/code/ssl-aug-benchmark/augmentation/mbda/features/style_feats_adain_1000.npy"
    # OR relative to working directory:
    # features_path: "augmentation/mbda/features/style_feats_adain_1000.npy"
    
    # Optional: paths to pretrained models
    encoder_path: "$HOME/my_work/code/ssl-aug-benchmark/augmentation/mbda/experiments/adaIN/vgg_normalised.pth"
    decoder_path: "$HOME/my_work/code/ssl-aug-benchmark/augmentation/mbda/experiments/adaIN/decoder.pth"
    
    # Alpha blending strength [0, 1]
    # 0 = only content, 1 = full style transfer
    alpha_min: 0.7
    alpha_max: 1.0
    
    # Probability of applying style transfer to samples in batch [0, 1]
    # 0.5 means ~50% of batch will be augmented
    probability: 0.25