defaults:
  - _self_
  - augmentations: symmetric.yaml
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "simclr-mvtec-ad"
method: "simclr"
backbone:
  name: "resnet18"
method_kwargs:
  proj_hidden_dim: 2048
  proj_output_dim: 256
  temperature: 0.2
data:
  dataset: mvtec-ad
  # MVTec-AD structure: mvtec/bottle/train/good/, mvtec/cable/train/good/, etc.
  # Using parent mvtec directory - loader will aggregate all category subdirectories
  train_path: "/home/RUS_CIP/st190519/my_work/code/ssl-aug-benchmark/learning/draem/datasets/mvtec"
  val_path: "/home/RUS_CIP/st190519/my_work/code/ssl-aug-benchmark/learning/draem/datasets/mvtec"
  format: "image_folder"
  num_workers: 4
optimizer:
  name: "lars"
  batch_size: 32  # Reduced from 64 due to larger image sizes (800-1024px)
  lr: 0.2  # Reduced from 0.25 for smaller batch size
  classifier_lr: 0.1
  weight_decay: 1e-4
  kwargs:
    clip_lr: True
    eta: 0.02
    exclude_bias_n_norm: True
scheduler:
  name: "warmup_cosine"
checkpoint:
  enabled: True
  dir: "trained_models"
  frequency: 1
auto_resume:
  enabled: True

# overwrite PL stuff
max_epochs: 200  # Reduced from 250 for smaller dataset (~5000 images total)
devices: [0, 1]
sync_batchnorm: False
accelerator: "gpu"
strategy: "ddp"
precision: 16-mixed
