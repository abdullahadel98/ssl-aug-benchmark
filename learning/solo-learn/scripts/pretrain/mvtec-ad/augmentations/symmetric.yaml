- rrc:
    enabled: True
    crop_min_scale: 0.08
    crop_max_scale: 1.0
  color_jitter:
    prob: 0.8
    brightness: 0.8
    contrast: 0.8
    saturation: 0.8
    hue: 0.2
  grayscale:
    prob: 0.2
  gaussian_blur:
    prob: 0.5
  solarization:
    prob: 0.0
  equalization:
    prob: 0.0
  horizontal_flip:
    prob: 0.5
  trivial_augment:
    enabled: False
    num_magnitude_bins: 31
    # interpolation: transforms.InterpolationMode.NEAREST
  rand_augment:
    enabled: False
    num_ops: 3
    magnitude: 9
    num_magnitude_bins: 31
  crop_size: 224
  num_crops: 2
  # MVTec images vary from 800x800 to 1024x1024 pixels
  # Resize before cropping to avoid issues with variable sizes
  # Standard resizing: first resize to 256px shortest side, then crop to 224
  resize_to_backbone: 256
